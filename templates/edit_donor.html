
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Donor | BloodCare</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <section class="registration">

        <div class="form-container">

            <h1>Edit Donor Details</h1>
            <p>Update donor information below.</p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="success-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <label>Full Name</label>
                <input type="text" name="name"
                       value="{{ donor[1] }}" required>

                <label>Age</label>
                <input type="number" name="age"
                       value="{{ donor[2] }}" min="18" required>

                <label>Gender</label>
                <select name="gender" required>
                    <option value="Male" {% if donor[3] == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if donor[3] == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if donor[3] == 'Other' %}selected{% endif %}>Other</option>
                </select>

                <label>Blood Group</label>
                <select name="blood_group" required>
                    {% for group in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                        <option value="{{ group }}"
                        {% if donor[4] == group %}selected{% endif %}>
                            {{ group }}
                        </option>
                    {% endfor %}
                </select>

                <label>Contact Number</label>
                <input type="text" name="phone"
                       value="{{ donor[5] }}" required>

                <label>City</label>
                <input type="text" name="city"
                       value="{{ donor[6] }}" required>

                <label>Address</label>
                <textarea name="address" required>{{ donor[7] }}</textarea>

                <button type="submit" class="submit-btn">
                    Update Donor
                </button>

            </form>

            <a href="/admin">Back to Dashboard</a>

        </div>

    </section>

</body>
</html>
